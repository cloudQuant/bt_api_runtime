[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-api-runtime"
version = "0.1.7"
description = "Constrained I52 paper/live read-only assembly for Backtrader"
requires-python = ">=3.9"
dependencies = [
    "back-trader-python>=1.4.0",
    "bt-api-run-contract==0.1.4",
    "bt_api_base>=0.15.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.black]
line-length = 100
target-version = ["py39"]
